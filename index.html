<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1017">
<title>Command Centre</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
:root{
  --ah:235;
  --bg:#eceff5; --surface:#f8f9fc; --surface2:#e2e6f0; --line:#cfd5e4;
  --fg:#14182a; --muted:#566079;
  --accent:hsl(var(--ah) 62% 44%); --accent-soft:hsl(var(--ah) 70% 92%); --accent-ink:#ffffff;
  --good:#14804a; --warn:#a96400; --bad:#b3261e;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1017; --surface:#151a24; --surface2:#1d2331; --line:#272f42;
  --fg:#e8ebf3; --muted:#8f98b0;
  --accent:hsl(var(--ah) 82% 72%); --accent-soft:hsl(var(--ah) 40% 20%); --accent-ink:#0d1017;
  --good:#4cc38a; --warn:#e0a040; --bad:#ff7a70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1017; --surface:#151a24; --surface2:#1d2331; --line:#272f42;
  --fg:#e8ebf3; --muted:#8f98b0;
  --accent:hsl(var(--ah) 82% 72%); --accent-soft:hsl(var(--ah) 40% 20%); --accent-ink:#0d1017;
  --good:#4cc38a; --warn:#e0a040; --bad:#ff7a70; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:800;letter-spacing:.02em;text-wrap:balance;line-height:1.05}
h2{font-size:34px;text-transform:uppercase}
h3{font-size:20px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.wrap{max-width:1080px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:1080px;margin:0 auto}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.14em;text-transform:uppercase}
.brand i{font-style:normal;color:var(--accent)}
.clock{font-family:var(--mono);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.rail{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:none;display:flex;align-items:center;gap:6px;background:none;border:0;border-bottom:2px solid transparent;padding:9px 11px;color:var(--muted);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.rail button:hover{color:var(--fg)}
.rail button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding-top:24px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.head p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.panel>h3{margin-bottom:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile .lab{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .big{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.tile .sub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.over>i{background:var(--warn)}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:5px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:8px 10px;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{width:100%;min-height:90px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);padding:0}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form input[type=text],.form input:not([type]){flex:1 1 160px}
.form input[type=number]{width:96px}
.lab2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:18px 4px;text-align:center;border:1px dashed var(--line);border-radius:6px}
.list{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.list>li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);min-width:0}
.list>li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.done{text-decoration:line-through;color:var(--muted)}
.scroll{overflow-x:auto}
table.hab{border-collapse:collapse;width:100%;min-width:560px}
.hab th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:6px 4px;text-align:center}
.hab th:first-child,.hab td:first-child{text-align:left}
.hab td{padding:6px 4px;border-top:1px solid var(--line);text-align:center}
.hab th.today{color:var(--accent)}
.dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer;display:inline-grid;place-items:center;color:var(--accent-ink)}
.dot:hover{border-color:var(--accent)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.dot.future{opacity:.35}
.streak{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.streak b{color:var(--fg)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.cal button{aspect-ratio:1/1;max-height:72px;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums}
.cal button.out{opacity:.4}
.cal button.today{border-color:var(--accent);color:var(--accent);font-weight:600}
.cal button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cal .pips{display:flex;gap:2px;height:5px}
.cal .pips i{width:5px;height:5px;border-radius:50%;background:currentColor}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)}h2{font-size:30px}}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{flex:1 1 90px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;min-width:0}
.days button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.days .d{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.days .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setrow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;align-items:center;margin-top:6px}
.setrow input[type=number]{width:100%}
.hint{font-family:var(--mono);font-size:12px;color:var(--muted)}
.live{border-color:var(--accent)}
.pill{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-radius:20px;padding:2px 9px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.spark{width:100%;height:56px;display:block}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--accent)}
.up{color:var(--good)}.down{color:var(--bad)}
.ringbox{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.ring{width:160px;height:160px;flex:none}
.ring .trk{fill:none;stroke:var(--surface2);stroke-width:12}
.ring .val{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring.over .val{stroke:var(--warn)}
.ring text{fill:var(--fg);font-family:var(--display);font-weight:800;text-anchor:middle}
.ring .sm{fill:var(--muted);font-family:var(--body);font-weight:400;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--mono);text-anchor:middle}
.chart .bar1{fill:var(--accent)}.chart .bar1.over{fill:var(--warn)}
.chart .goal{stroke:var(--muted);stroke-dasharray:3 3;stroke-width:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.timer{display:flex;flex-direction:column;align-items:center;gap:16px;padding:12px 0}
.timer .t{font-family:var(--display);font-weight:800;font-size:112px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
@media (max-width:480px){.timer .t{font-size:84px}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--bg);border:0;padding:7px 14px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button+button{border-left:1px solid var(--line)}
.notes{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.note{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.note.pin{border-color:var(--accent)}
.note h4{margin:0;font-size:15px;overflow-wrap:anywhere}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-size:14px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--fg)}
.sync{font-family:var(--mono);font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;z-index:40;max-width:90vw}
.focusline{display:flex;flex-direction:column;gap:6px}
.focusline .q{color:var(--muted);font-style:italic}
.focusline input{font-size:17px;padding:10px 12px}
@media (prefers-reduced-motion:no-preference){.bar>i,.ring .val{transition:all .35s ease}}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="brandrow"><div class="brand">Command<i>/</i>Centre</div><div class="clock" id="clock">--:--</div></div>
  <nav class="rail" id="rail" aria-label="Modules"></nav>
</div></div>
<div class="wrap"><main id="app"></main></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])};
var addDays=function(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x};
var mondayOf=function(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
var DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var num=function(v){var n=parseFloat(v);return isFinite(n)?n:0};
var fmtN=function(n){return Math.round(n).toLocaleString('en-GB')};

var ICONS={
 home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
 habits:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 projects:'<path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/>',
 'gym-plan':'<path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/>',
 'gym-stats':'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
 calories:'<path d="M12 3c3 4 6 6 6 10a6 6 0 0 1-12 0c0-2 1-3 2-4 .5 2 1.5 2.5 2.5 2.5C10 9 10.5 6 12 3z"/>',
 books:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5zM4 19a2 2 0 0 0 2 2h13"/>',
 notes:'<path d="M5 3h10l4 4v14H5zM14 3v5h5M8 13h8M8 17h6"/>',
 focus:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',
 prefs:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'
};
var ic=function(n){return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">'+ICONS[n]+'</svg>'};
var MODS=[['home','Home'],['habits','Habits'],['calendar','Calendar'],['projects','Projects'],['gym-plan','Gym Plan'],['gym-stats','Gym Stats'],['calories','Calories'],['books','Books'],['notes','Notes'],['focus','Focus'],['prefs','Settings']];

var QUOTES=['Do the next small thing well.','Consistency beats intensity.','Protect the first hour.','One clear priority is enough.','Make it easy to start.','Finish what is already open.','Sleep is training too.','Show up, then adjust.','Slow is smooth, smooth is fast.','Write it down, then let it go.','Progress is quiet and cumulative.','Remove one obstacle today.','Ship the draft.','Rest is part of the plan.'];
var EXS=['Barbell Bench Press','Incline Dumbbell Press','Barbell Back Squat','Conventional Deadlift','Overhead Press','Lat Pulldown','Machine Barbell Row','Dumbbell Bicep Curl','Tricep Cable Pushdown','Leg Press','Romanian Deadlift','Pull-up','Lateral Raise','Walking Lunge'];
var HUES={Indigo:235,Teal:178,Amber:40,Rose:345,Green:140,Violet:280};

/* ---------- State & Multi-Table Supabase Sync Architecture ---------- */
var SUPABASE_URL = 'https://vjyawtxmobxgclrwsgfx.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_8kujQY7du_nwIN8DvYvBxw_MeW-ZsjN';
var CFG_OK = SUPABASE_URL.indexOf('YOUR_') < 0 && SUPABASE_ANON_KEY.indexOf('YOUR_') < 0;
var sb = null, currentUser = null;

var habits = JSON.parse(localStorage.getItem('dash_matrix_habits')) || [{id:'1', name:'Drink 3L water', days:{}}, {id:'2', name:'Read 20 minutes', days:{}}];
var habitLogs = JSON.parse(localStorage.getItem('dash_matrix_logs')) || {};
var calendarEvents = JSON.parse(localStorage.getItem('dash_calendar_events')) || {};
var projects = JSON.parse(localStorage.getItem('dash_projects')) || [{id:'1', title:'PocketDAC Handheld', desc:'ESP32 Audio Player', tasks:[]}];
var gymRoutines = JSON.parse(localStorage.getItem('dash_gym_routines')) || (function(){
  var r={}; for(var i=0;i<7;i++) r[i]={name:i===0?'Push Day':'', ex:i===0?[{id:'e1',name:'Bench Press',sets:4,reps:8,weight:'80kg'}]:[]}; return r;
})();
var gymHistory = JSON.parse(localStorage.getItem('dash_gym_history')) || [];
var exerciseLibrary = JSON.parse(localStorage.getItem('dash_ex_library')) || EXS;
var calorieTarget = parseInt(localStorage.getItem('dash_cal_target')) || 3300;
var calorieLogs = JSON.parse(localStorage.getItem('dash_cal_logs')) || {};
var books = JSON.parse(localStorage.getItem('dash_books')) || [{id:'1', title:'Atomic Habits', author:'James Clear', current:50, total:300}];
var notes = JSON.parse(localStorage.getItem('dash_notes')) || [];
var focusCfg = JSON.parse(localStorage.getItem('dash_focus_cfg')) || {focus:25, short:5, long:15};
var sessions = JSON.parse(localStorage.getItem('dash_sessions')) || {};
var todayFocus = JSON.parse(localStorage.getItem('dash_today_focus')) || {};
var theme = localStorage.getItem('dash_theme') || 'system';
var accentHue = parseInt(localStorage.getItem('dash_hue')) || 235;

var ui = {
  view:'home', weekOff:0, cal:{y:new Date().getFullYear(), m:new Date().getMonth()}, sel:iso(new Date()),
  proj:null, planDay:(new Date().getDay()+6)%7, calDate:iso(new Date()), editNote:null, noteQ:'', editH:false, confirm:null, sync:'Local only', importOpen:false, exportText:'',
  t:{mode:'focus', remaining:25*60, end:0, running:false}
};

/* Supabase Connection Setup */
function initAuth(){
  if(!CFG_OK){ ui.sync='Cloud sync not configured'; return; }
  if(!window.supabase){ ui.sync='Sync library failed'; return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.getSession().then(function(r){ handleSession(r.data.session); });
  sb.auth.onAuthStateChange(function(ev, s){ handleSession(s); });
}

async function handleSession(s){
  if(s){
    currentUser = s.user;
    ui.sync = 'Connected & Synced';
    await loadAllDataFromCloud();
  } else {
    currentUser = null;
    ui.sync = 'Signed out (Local mode)';
  }
  paintSync();
  if(ui.view==='prefs'||ui.view==='home') render();
}

function paintSync(){ var e=$('#syncline'); if(e) e.textContent = ui.sync; }

async function loadAllDataFromCloud(){
  if(!currentUser) return;
  try {
    var hData = await sb.from('habits').select('*').eq('user_id', currentUser.id);
    if(hData.data && hData.data.length > 0) habits = hData.data;

    var lData = await sb.from('habit_logs').select('*').eq('user_id', currentUser.id);
    if(lData.data){ habitLogs = {}; lData.data.forEach(function(row){ habitLogs[row.date + '-' + row.habit_id] = row.completed; }); }

    var cData = await sb.from('calendar_events').select('*').eq('user_id', currentUser.id);
    if(cData.data){ calendarEvents = {}; cData.data.forEach(function(row){ calendarEvents[row.date] = row.events; }); }

    var pData = await sb.from('projects').select('*').eq('user_id', currentUser.id);
    if(pData.data && pData.data.length > 0) projects = pData.data;

    var gData = await sb.from('gym_routines').select('*').eq('user_id', currentUser.id);
    if(gData.data && gData.data.length > 0) {
      gData.data.forEach(function(row){ gymRoutines[row.day_index || 0] = {name: row.title, desc: row.desc, ex: row.exercises}; });
    }

    var ghData = await sb.from('gym_history').select('*').eq('user_id', currentUser.id);
    if(ghData.data && ghData.data.length > 0) gymHistory = ghData.data.map(function(r){ return {routineTitle: r.routine_title, date: r.date, exercises: r.exercises_json}; });

    var bData = await sb.from('books').select('*').eq('user_id', currentUser.id);
    if(bData.data && bData.data.length > 0) books = bData.data.map(function(b){ return {id:b.id, title:b.title, author:b.author, current:b.current, total:b.total}; });

    ui.sync = 'Synced';
    paintSync();
    render();
  } catch(err){
    console.log('Cloud sync error:', err);
    ui.sync = 'Sync failed. Using local storage.';
    paintSync();
  }
}

/* ---------- Helpers & Calculations ---------- */
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2200)}
function asked(key){if(ui.confirm===key){ui.confirm=null;return true}ui.confirm=key;render();return false}
function delBtn(kind,id,extra){var k=kind+':'+id+(extra||'');var on=ui.confirm===k;return '<button class="btn sm '+(on?'danger':'ghost')+'" data-act="del" data-kind="'+kind+'" data-id="'+esc(id)+'" data-x="'+esc(extra||'')+'">'+(on?'Confirm delete':'Delete')+'</button>'}
function head(t,sub,right){return '<div class="head"><div><h2>'+t+'</h2>'+(sub?'<p>'+sub+'</p>':'')+'</div>'+(right?'<div class="row">'+right+'</div>':'')+'</div>'}
function bar(p,over){return '<div class="bar'+(over?' over':'')+'"><i style="width:'+Math.max(0,Math.min(100,p))+'%"></i></div>'}
var today=function(){return iso(new Date())};

function habitStreak(h){var d=new Date();if(!h.days[iso(d)])d=addDays(d,-1);var n=0;while(h.days[iso(d)]){n++;d=addDays(d,-1)}return n}
function mealsOn(d){return calorieLogs[d]||[]}
function kcalOn(d){return mealsOn(d).reduce(function(a,m){return a+m.kcal},0)}
function e1rm(w,r){return r<=1?w:w*(1+r/30)}
function bestSet(sets){var b=null;sets.forEach(function(s){if(!b||e1rm(num(s.actualWeight||s.weight),num(s.actualReps||s.reps))>e1rm(num(b.actualWeight||b.weight),num(b.actualReps||b.reps)))b=s});return b}
function lastPerf(name){
  for(var i=gymHistory.length-1;i>=0;i--){
    var ses=gymHistory[i];
    if(ses.exercises){
      for(var j=0;j<ses.exercises.length;j++){
        var e=ses.exercises[j];
        if(e.name.toLowerCase()===name.toLowerCase()){
          return (e.actualWeight||e.weight||'0kg')+' × '+(e.actualReps||e.reps||'0');
        }
      }
    }
  }
  return null;
}
function projPct(p){return p.tasks.length?Math.round(p.tasks.filter(function(t){return t.done}).length/p.tasks.length*100):0}

V['gym-stats']=function(){
  var by={};
  gymHistory.forEach(function(w){
    if(w.exercises){
      w.exercises.forEach(function(e){
        if(!e.actualWeight && !e.weight) return;
        var wgt = parseFloat(e.actualWeight || e.weight) || 0;
        var rps = parseInt(e.actualReps || e.reps) || 1;
        var est = e1rm(wgt, rps);
        (by[e.name] = by[e.name] || []).push({d:w.date, w:wgt, r:rps, v:est});
      });
    }
  });
  var names=Object.keys(by).sort();
  var wkStart=iso(mondayOf(new Date()));
  var vol=0; gymHistory.forEach(function(w){if(w.date>=wkStart && w.exercises){w.exercises.forEach(function(e){vol+=(parseFloat(e.actualWeight||e.weight)||0)*(parseInt(e.actualReps||e.reps)||0)})}});
  var cards=names.map(function(n){
    var a=by[n],f=a[0],l=a[a.length-1],ch=f.v?((l.v-f.v)/f.v*100):0;
    var mx=Math.max.apply(null,a.map(function(x){return x.v})),mn=Math.min.apply(null,a.map(function(x){return x.v})),rg=(mx-mn)||1;
    var pts=a.map(function(x,i){return (a.length===1?150:8+i*(284/(a.length-1)))+','+(48-(x.v-mn)/rg*40)});
    var lastPt=pts[pts.length-1].split(',');
    return '<div class="panel"><div class="row" style="justify-content:space-between"><h3 style="margin:0;font-size:17px;text-transform:none;letter-spacing:.01em;font-family:var(--body);font-weight:600">'+esc(n)+'</h3><span class="mono '+(ch>=0?'up':'down')+'">'+(ch>=0?'+':'')+ch.toFixed(1)+'%</span></div>'+
    '<svg class="spark" viewBox="0 0 300 56" preserveAspectRatio="none" role="img" aria-label="Estimated 1RM trend"><polyline points="'+pts.join(' ')+'"/><circle cx="'+lastPt[0]+'" cy="'+lastPt[1]+'" r="3.5"/></svg>'+
    '<div class="row mono" style="justify-content:space-between;font-size:13px"><span>Last: '+l.w+' kg × '+l.r+'</span><span>Est. 1RM '+l.v.toFixed(1)+' kg</span></div><div class="hint" style="margin-top:4px">'+a.length+' session'+(a.length===1?'':'s')+' · first 1RM '+f.v.toFixed(1)+' kg</div></div>'}).join('');
  var recent=gymHistory.slice(-5).reverse().map(function(w, idx){return '<li><span class="mono muted">'+w.date+'</span><span class="grow">'+esc(w.routineTitle||'Workout')+'</span>'+delBtn('workout', idx)+'</li>'}).join('');
  return head('Gym stats &amp; progression','Estimated 1RM uses the Epley formula: weight × (1 + reps ÷ 30).')+
  '<div class="grid"><div class="tile" style="cursor:default"><span class="lab">Sessions logged</span><span class="big">'+gymHistory.length+'</span></div><div class="tile" style="cursor:default"><span class="lab">Volume this week</span><span class="big">'+fmtN(vol)+'<span style="font-size:18px"> kg</span></span></div></div>'+
  (names.length?'<div class="grid">'+cards+'</div><div class="panel"><h3>Recent sessions</h3><ul class="list">'+recent+'</ul></div>':'<div class="empty">No workouts logged yet. Start a live session from Gym Plan and your lifts appear here.</div>');
};

V.calories=function(){

  var days=[];for(var i=6;i>=0;i--)days.push(addDays(parse(d),-i));
  var mx=Math.max(calorieTarget,Math.max.apply(null,days.map(function(x){return kcalOn(iso(x))})))*1.1;
  var bars=days.map(function(x,i){var v=kcalOn(iso(x)),h=v/mx*70;return '<rect class="bar1'+(v>calorieTarget?' over':'')+'" x="'+(i*40+10)+'" y="'+(80-h)+'" width="24" height="'+h+'" rx="2"/><text x="'+(i*40+22)+'" y="94">'+DOW[(x.getDay()+6)%7][0]+'</text>'}).join('');
  var gy=80-calorieTarget/mx*70;
  var seen={},recent=[];for(var k in calorieLogs){calorieLogs[k].forEach(function(m){if(!seen[m.name.toLowerCase()]){seen[m.name.toLowerCase()]=1;recent.push(m)}})}
  recent=recent.slice(-8).reverse();
  return head('Calorie tracker',parse(d).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}),'<button class="btn ghost sm" data-act="calday" data-d="-1">‹</button><button class="btn ghost sm" data-act="calday" data-d="0">Today</button><button class="btn ghost sm" data-act="calday" data-d="1">›</button>')+
  '<div class="split"><div class="panel"><div class="ringbox">'+ring+'<div style="flex:1 1 160px;min-width:0"><div class="mono">Eaten <b>'+fmtN(kc)+'</b> kcal</div><div class="mono">Goal <b>'+fmtN(calorieTarget)+'</b> kcal</div>'+
  '<form data-form="goal" class="form" style="margin-top:10px"><input id="gl" type="number" min="500" max="10000" step="50" value="'+calorieTarget+'" aria-label="Daily goal"><button class="btn ghost sm" type="submit">Set goal</button></form></div></div>'+
  '<svg class="chart" viewBox="0 0 290 100" style="width:100%;margin-top:14px" role="img" aria-label="Last 7 days"><line class="goal" x1="0" x2="290" y1="'+gy+'" y2="'+gy+'"/>'+bars+'</svg><div class="hint">Last 7 days. Dashed line is your goal.</div></div>'+
  '<div class="panel"><h3>Meals</h3>'+(ms.length?'<ul class="list">'+ms.map(function(m, idx){return '<li><span class="grow">'+esc(m.name)+'</span><span class="mono">'+fmtN(m.kcal)+' kcal</span>'+delBtn('meal', idx)+'</li>'}).join('')+'</ul>':'<div class="empty">Nothing logged for this day.</div>')+
  '<form data-form="meal" class="form" style="margin-top:14px"><input id="mn" type="text" maxlength="60" placeholder="Meal description" required aria-label="Meal name"><input id="mk" type="number" min="0" max="10000" placeholder="kcal" required aria-label="Calories"><button class="btn" type="submit">Log</button></form>'+
  (recent.length?'<div class="lab2" style="margin:14px 0 6px">Log again</div><div class="chips">'+recent.map(function(m){return '<button class="chip" data-act="relog" data-n="'+esc(m.name)+'" data-k="'+m.kcal+'">'+esc(m.name)+' · '+m.kcal+'</button>'}).join('')+'</div>':'')+'</div></div>';
};

V.books=function(){
  return head('Book tracker',books.filter(function(b){return (b.current||b.cur||0)>=(b.total||b.pages||100)}).length+' finished · '+books.filter(function(b){return (b.current||b.cur||0)<(b.total||b.pages||100)}).length+' in progress')+
  (books.length?'<div class="grid">'+books.map(function(b, idx){var cur=b.current||b.cur||0, tot=b.total||b.pages||100, p=tot?Math.round(cur/tot*100):0;
    return '<div class="panel"><div class="row" style="justify-content:space-between;align-items:flex-start"><div style="min-width:0"><strong style="overflow-wrap:anywhere">'+esc(b.title)+'</strong><div class="muted" style="overflow-wrap:anywhere">'+esc(b.author||'Unknown author')+'</div></div>'+(p>=100?'<span class="pill">Finished</span>':'')+'</div>'+
    '<div style="margin:12px 0 6px">'+bar(p)+'</div><div class="form"><input type="number" min="0" max="'+tot+'" value="'+cur+'" data-chg="bookpg" data-id="'+idx+'" style="width:90px" aria-label="Current page"><span class="mono muted">/ '+tot+' pages · '+p+'%</span></div><div style="margin-top:10px">'+delBtn('book', idx)+'</div></div>'}).join('')+'</div>':'<div class="empty">No books yet.</div>')+
  '<div class="panel"><h3>Add a book</h3><form data-form="book" class="form"><input id="bt" type="text" maxlength="100" placeholder="Title" required aria-label="Title"><input id="ba" type="text" maxlength="80" placeholder="Author" aria-label="Author"><input id="bp" type="number" min="1" max="5000" placeholder="Pages" required aria-label="Total pages"><button class="btn" type="submit">Add book</button></form></div>';
};

V.notes=function(){
  var q=ui.noteQ.toLowerCase();
  var list=notes.filter(function(n){return !q||(n.title+' '+n.body).toLowerCase().indexOf(q)>-1}).sort(function(a,b){return (b.pin?1:0)-(a.pin?1:0)||b.t-a.t});
  var ed=notes.filter(function(n){return n.id===ui.editNote})[0];
  return head('Quick notes',notes.length+' note'+(notes.length===1?'':'s'))+
  '<div class="panel"><form data-form="note"><div class="form"><input id="nt" type="text" maxlength="80" placeholder="Title (optional)" value="'+esc(ed?ed.title:'')+'" aria-label="Note title"></div><div style="height:8px"></div><textarea id="nb" placeholder="Write something…" aria-label="Note" required>'+esc(ed?ed.body:'')+'</textarea><div class="row" style="margin-top:8px"><button class="btn" type="submit">'+(ed?'Save changes':'Add note')+'</button>'+(ed?'<button class="btn ghost" type="button" data-act="cancelnote">Cancel</button>':'')+'</div></form></div>'+
  '<div class="form"><input id="ns" type="text" placeholder="Search notes" value="'+esc(ui.noteQ)+'" data-chg="nsearch" aria-label="Search notes"></div>'+
  (list.length?'<div class="notes">'+list.map(function(n){return '<div class="note'+(n.pin?' pin':'')+'">'+(n.title?'<h4>'+esc(n.title)+'</h4>':'')+'<p>'+esc(n.body)+'</p><div class="row"><button class="btn ghost sm" data-act="pin" data-id="'+n.id+'">'+(n.pin?'Unpin':'Pin')+'</button><button class="btn ghost sm" data-act="editnote" data-id="'+n.id+'">Edit</button>'+delBtn('note',n.id)+'</div></div>'}).join('')+'</div>':'<div class="empty">'+(q?'No notes match.':'No notes yet.')+'</div>');
};

V.focus=function(){
  var t=ui.t,cfg=focusCfg;
  return head('Focus timer','Sessions today: '+(sessions[today()]||0))+
  '<div class="panel"><div class="timer"><div class="seg" role="group" aria-label="Mode">'+[['focus','Focus'],['short','Short break'],['long','Long break']].map(function(m){return '<button data-act="tmode" data-m="'+m[0]+'" aria-pressed="'+(t.mode===m[0])+'">'+m[1]+'</button>'}).join('')+'</div>'+
  '<div class="t" id="tdisp" role="timer">'+fmtT(t.remaining)+'</div><div class="row"><button class="btn" data-act="tgo" id="tgo">'+(t.running?'Pause':'Start')+'</button><button class="btn ghost" data-act="treset">Reset</button></div></div></div>'+
  '<div class="panel"><h3>Lengths (minutes)</h3><form data-form="tcfg" class="form"><label class="muted">Focus <input id="cf" type="number" min="1" max="180" value="'+cfg.focus+'" style="width:72px"></label><label class="muted">Short <input id="cs" type="number" min="1" max="60" value="'+cfg.short+'" style="width:72px"></label><label class="muted">Long <input id="cl" type="number" min="1" max="90" value="'+cfg.long+'" style="width:72px"></label><button class="btn ghost sm" type="submit">Save</button></form></div>';
};
function fmtT(s){s=Math.max(0,Math.ceil(s));return pad(Math.floor(s/60))+':'+pad(s%60)}

V.prefs=function(){
  return head('Settings &amp; data')+
  '<div class="panel"><h3>Appearance</h3><div class="seg" role="group" aria-label="Theme">'+['light','dark','system'].map(function(t){return '<button data-act="theme" data-t="'+t+'" aria-pressed="'+(theme===t)+'">'+t[0].toUpperCase()+t.slice(1)+'</button>'}).join('')+'</div>'+
  '<div class="lab2" style="margin:16px 0 8px">Accent colour</div><div class="sw">'+Object.keys(HUES).map(function(k){return '<button data-act="hue" data-h="'+HUES[k]+'" aria-pressed="'+(accentHue===HUES[k])+'" aria-label="'+k+'" title="'+k+'" style="background:hsl('+HUES[k]+' 65% 50%)"></button>'}).join('')+'</div></div>'+
  authPanel()+
  '<div class="panel"><h3>Data</h3><div class="row"><button class="btn" data-act="export">Export JSON</button><button class="btn ghost" data-act="importtoggle">Import JSON</button></div>'+
  (ui.exportText?'<p class="muted" style="margin:12px 0 6px">Copy this backup and keep it safe.</p><textarea id="expt" readonly>'+esc(ui.exportText)+'</textarea>':'')+
  (ui.importOpen?'<div style="margin-top:12px"><input type="file" id="impfile" accept=".json,application/json" aria-label="Backup file"><p class="muted" style="margin:10px 0 6px">Or paste a backup here.</p><textarea id="impt" placeholder="{ … }"></textarea><div class="row" style="margin-top:8px"><button class="btn" data-act="doimport">Replace my data with this</button></div></div>':'')+'</div>'+
  '<div class="panel"><h3>Danger zone</h3><p class="muted" style="margin:0 0 10px">Removes every habit, workout, meal, book and note.</p><button class="btn '+(ui.confirm==='reset'?'danger':'ghost')+'" data-act="reset">'+(ui.confirm==='reset'?'Yes, erase everything':'Factory reset')+'</button></div>';
};

function authPanel(){
  if(!CFG_OK) return '<div class="panel"><h3>Cloud sync</h3><p class="muted" style="margin:0">Add your Supabase URL and anon key in the script configuration above.</p></div>';
  if(currentUser) return '<div class="panel"><h3>Cloud sync</h3><p style="margin:0 0 6px">Signed in as <strong>'+esc(currentUser.email||'your account')+'</strong></p><div class="sync" id="syncline">'+esc(ui.sync)+'</div><div class="row" style="margin-top:12px"><button class="btn ghost sm" data-act="signout">Sign out</button></div></div>';
  return '<div class="panel"><h3>Cloud sync login</h3><p class="muted" style="margin:0 0 12px">Sign in to sync your dashboard.</p><form data-form="auth" class="form"><input id="ae" type="email" autocomplete="email" placeholder="Email" required aria-label="Email"><input id="ap" type="password" autocomplete="current-password" minlength="6" placeholder="Password" required aria-label="Password"><button class="btn" type="submit" data-mode="in">Sign in</button><button class="btn ghost" type="submit" data-mode="up">Sign up</button></form><div class="sync" id="syncline" style="margin-top:10px">'+esc(ui.sync)+'</div></div>';
}

/* ---------- Render & Navigation ---------- */
function renderRail(){
  $('#rail').innerHTML=MODS.map(function(m){return '<button data-act="nav" data-v="'+m[0]+'"'+(ui.view===m[0]?' aria-current="page"':'')+'>'+ic(m[0])+m[1]+'</button>'}).join('');
}
function render(){
  var f=V[ui.view]||V.home;
  var y=window.scrollY;
  $('#app').innerHTML=f();
  renderRail();
  var sel=$('#exsel');if(sel)sel.dispatchEvent(new Event('change',{bubbles:true}));
  window.scrollTo(0,y);
}
function applyTheme(){
  var r=document.documentElement;
  if(theme==='light'||theme==='dark') r.setAttribute('data-theme', theme); else r.removeAttribute('data-theme');
  r.style.setProperty('--ah', accentHue);
}

/* ---------- Actions & Event Listeners ---------- */
var A={
 nav:function(el){location.hash=el.dataset.v==='home'?'':el.dataset.v;if(!location.hash){setView('home')}},
 hab:async function(el){
   var h=habits.filter(function(x){return x.id===el.dataset.id})[0], d=el.dataset.d;
   if(h.days[d]) delete h.days[d]; else h.days[d]=true;
   save(); render();
   if(currentUser && sb){
     await sb.from('habit_logs').upsert({user_id: currentUser.id, habit_id: h.id, date: d, completed: !!h.days[d]}, {onConflict: 'user_id,habit_id,date'});
   }
 },
 week:function(el){var d=+el.dataset.d;ui.weekOff=d===0?0:ui.weekOff+d;render()},
 editH:function(){ui.editH=!ui.editH;render()},
 cal:function(el){var d=+el.dataset.d;if(d===0){var n=new Date();ui.cal={y:n.getFullYear(),m:n.getMonth()};ui.sel=today()}else{var x=new Date(ui.cal.y,ui.cal.m+d,1);ui.cal={y:x.getFullYear(),m:x.getMonth()}}render()},
 selday:function(el){ui.sel=el.dataset.d;var p=parse(ui.sel);ui.cal={y:p.getFullYear(),m:p.getMonth()};render()},
 openproj:function(el){ui.proj=el.dataset.id;render()},
 projback:function(){ui.proj=null;render()},
 plan:function(el){ui.planDay=+el.dataset.d;render()},
 rmex:async function(el){
   var idx=+el.dataset.id;
   gymRoutines[ui.planDay].ex.splice(idx,1);
   save(); render();
   if(currentUser && sb){
     var rd = gymRoutines[ui.planDay];
     await sb.from('gym_routines').upsert({user_id: currentUser.id, day_index: ui.planDay, title: rd.name, desc: rd.desc, exercises: rd.ex}, {onConflict: 'user_id,day_index'});
   }
 },
 startlive:function(){
   var rd=gymRoutines[ui.planDay];
   if(!rd.ex || !rd.ex.length) return;
   var workoutSession = {routineTitle: rd.name||DOW[ui.planDay], date: today(), exercises: rd.ex.map(function(e){return {name:e.name, weight:e.weight||'0kg', reps:e.reps||10, actualWeight:e.weight||'0kg', actualReps:e.reps||10}})});
   gymHistory.push(workoutSession);
   save(); toast('Workout logged successfully!'); render();
 },
 calday:function(el){var d=+el.dataset.d;ui.calDate=d===0?today():iso(addDays(parse(ui.calDate),d));render()},
 relog:function(el){(calorieLogs[ui.calDate]=calorieLogs[ui.calDate]||[]).push({name:el.dataset.n, kcal:+el.dataset.k});save();render()},
 pin:function(el){var n=notes.filter(function(x){return x.id===el.dataset.id})[0];n.pin=!n.pin;save();render()},
 editnote:function(el){ui.editNote=el.dataset.id;render();window.scrollTo(0,0)},
 cancelnote:function(){ui.editNote=null;render()},
 tmode:function(el){setMode(el.dataset.m)},
 tgo:function(){var t=ui.t;if(t.running){t.remaining=(t.end-Date.now())/1000;t.running=false}else{if(t.remaining<=0)t.remaining=focusCfg[t.mode]*60;t.end=Date.now()+t.remaining*1000;t.running=true}paintTimer();$('#tgo').textContent=t.running?'Pause':'Start'},
 treset:function(){var t=ui.t;t.running=false;t.remaining=focusCfg[t.mode]*60;render()},
 theme:function(el){theme=el.dataset.t;localStorage.setItem('dash_theme', theme);applyTheme();save();render()},
 hue:function(el){accentHue=+el.dataset.h;localStorage.setItem('dash_hue', accentHue);applyTheme();save();render()},
 export:function(){
   var txt=JSON.stringify({habits, habitLogs, calendarEvents, projects, gymRoutines, gymHistory, calorieTarget, calorieLogs, books, notes, focusCfg, sessions},null,2);
   ui.exportText=txt; render();
 },
 signout:async function(){if(sb){await sb.auth.signOut()} toast('Signed out.')},
 importtoggle:function(){ui.importOpen=!ui.importOpen;render()},
 doimport:async function(){
   var txt=($('#impt')||{}).value||'';
   var f=$('#impfile');
   try{
     if(!txt.trim()&&f&&f.files[0]) txt=await f.files[0].text();
     var o=JSON.parse(txt);if(!o||!o.habits) throw new Error('bad');
     habits=o.habits; calendarEvents=o.calendarEvents||{}; projects=o.projects||[]; books=o.books||[]; notes=o.notes||[];
     ui.importOpen=false; save(); toast('Data imported.'); render();
   }catch(e){toast('Invalid backup file.')}
 },
 reset:function(){if(ui.confirm==='reset'){ui.confirm=null;localStorage.clear();location.reload()}else{ui.confirm='reset';render()}},
 del:async function(el){
   var kind=el.dataset.kind, id=el.dataset.id, key=kind+':'+id+(el.dataset.x||'');
   if(!asked(key)) return;
   if(kind==='habit'){
     habits=habits.filter(function(x){return x.id!==id});
     if(currentUser && sb) await sb.from('habits').delete().eq('id', id);
   }
   if(kind==='event'){
     var dateKey = el.dataset.id, idx = parseInt(el.dataset.x);
     if(calendarEvents[dateKey]){ calendarEvents[dateKey].splice(idx, 1); if(calendarEvents[dateKey].length===0) delete calendarEvents[dateKey]; }
   }
   if(kind==='project'){
     projects=projects.filter(function(x){return x.id!==id}); ui.proj=null;
     if(currentUser && sb) await sb.from('projects').delete().eq('id', id);
   }
   if(kind==='task'){
     var p=projects.filter(function(x){return x.id===ui.proj})[0];
     p.tasks.splice(parseInt(id), 1);
     if(currentUser && sb) await sb.from('projects').upsert({id:p.id, user_id:currentUser.id, title:p.title||p.name, desc:p.desc, tasks:p.tasks});
   }
   if(kind==='workout') gymHistory.splice(parseInt(id), 1);
   if(kind==='meal') calorieLogs[ui.calDate].splice(parseInt(id), 1);
   if(kind==='book'){
     var bId = books[parseInt(id)].id;
     books.splice(parseInt(id), 1);
     if(currentUser && sb) await sb.from('books').delete().eq('id', bId);
   }
   if(kind==='note') notes=notes.filter(function(x){return x.id!==id});
   save(); render();
 }
};

var F={
 auth:async function(f,e){
   if(!sb) return;
   var mode=(e.submitter&&e.submitter.dataset.mode)||'in', em=$('#ae').value.trim(), pw=$('#ap').value;
   ui.sync=mode==='up'?'Creating account…':'Signing in…'; paintSync();
   try{
     var r=mode==='up'?await sb.auth.signUp({email:em,password:pw}):await sb.auth.signInWithPassword({email:em,password:pw});
     if(r.error) throw r.error;
     if(mode==='up'&&!r.data.session){ ui.sync='Check your email to confirm.'; paintSync(); }
   }catch(err){ ui.sync=err.message||'Authentication failed'; paintSync(); }
 },
 focus:function(){var v=$('#fi').value.trim();if(v) todayFocus[today()]=v; else delete todayFocus[today()]; save(); toast('Focus saved.')},
 habit:async function(){
   var v=$('#hn').value.trim();if(!v) return;
   var newH = {id:uid(), name:v, days:{}};
   habits.push(newH); save(); render();
   if(currentUser && sb) await sb.from('habits').insert({id:newH.id, user_id:currentUser.id, name:newH.name});
 },
 event:async function(){
   var v=$('#ex').value.trim();if(!v) return;
   calendarEvents[ui.sel]=calendarEvents[ui.sel]||[];
   calendarEvents[ui.sel].push(v);
   save(); render();
   if(currentUser && sb) await sb.from('calendar_events').upsert({user_id:currentUser.id, date:ui.sel, events:calendarEvents[ui.sel]}, {onConflict:'user_id,date'});
 },
 project:async function(){
   var v=$('#pn').value.trim();if(!v) return;
   var p={id:uid(), title:v, desc:'', tasks:[]};
   projects.push(p); ui.proj=p.id; save(); render();
   if(currentUser && sb) await sb.from('projects').insert({id:p.id, user_id:currentUser.id, title:v, desc:'', tasks:[]});
 },
 task:async function(){
   var v=$('#tn').value.trim();if(!v) return;
   var p=projects.filter(function(x){return x.id===ui.proj})[0];
   p.tasks.push({text:v, done:false}); save(); render();
   if(currentUser && sb) await sb.from('projects').upsert({id:p.id, user_id:currentUser.id, title:p.title||p.name, desc:p.desc, tasks:p.tasks});
 },
 addex:async function(){
   var s=$('#exsel').value, name=s==='__custom'?$('#excustom').value.trim():s; if(!name) return;
   var rd = gymRoutines[ui.planDay];
   rd.ex.push({id:uid(), name:name, sets:3, reps:10, weight:'0kg'});
   save(); render();
   if(currentUser && sb) await sb.from('gym_routines').upsert({user_id:currentUser.id, day_index:ui.planDay, title:rd.name, desc:rd.desc, exercises:rd.ex}, {onConflict:'user_id,day_index'});
 },
 goal:function(){var v=num($('#gl').value);if(v>=500){calorieTarget=Math.round(v);save();render()}},
 meal:function(){var n=$('#mn').value.trim(),k=num($('#mk').value);if(!n||k<0)return;(calorieLogs[ui.calDate]=calorieLogs[ui.calDate]||[]).push({name:n,kcal:Math.round(k)});save();render()},
 book:async function(){
   var t=$('#bt').value.trim(),p=Math.round(num($('#bp').value));if(!t||p<1)return;
   var newB={id:uid(), title:t, author:$('#ba').value.trim(), current:0, total:p};
   books.push(newB); save(); render();
   if(currentUser && sb) await sb.from('books').insert({id:newB.id, user_id:currentUser.id, title:newB.title, author:newB.author, current:0, total:newB.total});
 },
 note:function(){
   var b=$('#nb').value.trim(),t=$('#nt').value.trim();if(!b)return;
   if(ui.editNote){var n=notes.filter(function(x){return x.id===ui.editNote})[0];n.title=t;n.body=b;ui.editNote=null}
   else notes.push({id:uid(),title:t,body:b,pin:false,t:Date.now()});
   save();render();
 },
 tcfg:function(){focusCfg={focus:clamp($('#cf').value,1,180),short:clamp($('#cs').value,1,60),long:clamp($('#cl').value,1,90)};if(!ui.t.running)ui.t.remaining=focusCfg[ui.t.mode]*60;save();render();toast('Timer lengths saved.')}
};
function clamp(v,a,b){v=Math.round(num(v));return Math.max(a,Math.min(b,v||a))}

var C={
 hname:function(el){var h=habits.filter(function(x){return x.id===el.dataset.id})[0];if(el.value.trim())h.name=el.value.trim();save()},
 rname:async function(el){
   var rd=gymRoutines[ui.planDay]; rd.name=el.value.trim(); save();
   if(currentUser && sb) await sb.from('gym_routines').upsert({user_id:currentUser.id, day_index:ui.planDay, title:rd.name, desc:rd.desc, exercises:rd.ex}, {onConflict:'user_id,day_index'});
 },
 exsets:async function(el){
   var idx=+el.dataset.id; gymRoutines[ui.planDay].ex[idx].sets=clamp(el.value,1,20); save();
   if(currentUser && sb){
     var rd=gymRoutines[ui.planDay];
     await sb.from('gym_routines').upsert({user_id:currentUser.id, day_index:ui.planDay, title:rd.name, desc:rd.desc, exercises:rd.ex}, {onConflict:'user_id,day_index'});
   }
 },
 exreps:async function(el){
   var idx=+el.dataset.id; gymRoutines[ui.planDay].ex[idx].reps=clamp(el.value,1,100); save();
   if(currentUser && sb){
     var rd=gymRoutines[ui.planDay];
     await sb.from('gym_routines').upsert({user_id:currentUser.id, day_index:ui.planDay, title:rd.name, desc:rd.desc, exercises:rd.ex}, {onConflict:'user_id,day_index'});
   }
 },
 bookpg:async function(el){
   var idx=+el.dataset.id; var b=books[idx];
   b.current=Math.max(0,Math.min(b.total||b.pages||100,Math.round(num(el.value))));
   save(); render();
   if(currentUser && sb) await sb.from('books').upsert({id:b.id, user_id:currentUser.id, title:b.title, author:b.author, current:b.current, total:b.total||b.pages}, {onConflict:'id'});
 }
};

/* ---------- Focus Timer Logic ---------- */
function setMode(m){var t=ui.t;t.mode=m;t.running=false;t.remaining=focusCfg[m]*60;render()}
function paintTimer(){var t=ui.t,e=$('#tdisp');var s=t.running?(t.end-Date.now())/1000:t.remaining;if(e)e.textContent=fmtT(s);document.title=t.running?fmtT(s)+' · Command Centre':'Command Centre'}
setInterval(function(){
  var t=ui.t;
  if(t.running){
    var left=(t.end-Date.now())/1000;
    if(left<=0){t.running=false;t.remaining=0;if(t.mode==='focus'){sessions[today()]=(sessions[today()]||0)+1;save()}toast(t.mode==='focus'?'Focus session complete.':'Break is over.');if(ui.view==='focus')render();else paintTimer();document.title='Command Centre'}
    else paintTimer();
  }
},250);
setInterval(function(){var d=new Date();var e=$('#clock');if(e)e.textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())},1000);

/* ---------- Event Dispatchers ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el){if(ui.confirm){ui.confirm=null;var inForm=e.target.closest('input,textarea,select');if(!inForm)render()}return}
  var f=A[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();var fn=F[f.dataset.form];if(fn)fn(f,e);
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='exsel'){var c=$('#excustom');if(c)c.hidden=el.value!=='__custom';if(c&&!c.hidden)c.focus();return}
  if(el.dataset&&el.dataset.chg&&el.dataset.chg!=='nsearch'){var fn=C[el.dataset.chg];if(fn)fn(el)}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.chg==='nsearch'){ui.noteQ=el.value;var pos=el.selectionStart;render();var n=$('#ns');if(n){n.focus();n.setSelectionRange(pos,pos)}}
});
function setView(v){if(!V[v])v='home';ui.view=v;ui.confirm=null;render();window.scrollTo(0,0)}
window.addEventListener('hashchange',function(){setView(location.hash.replace('#','')||'home')});

/* ---------- Boot ---------- */
(function(){
  applyTheme();
  var h=location.hash.replace('#','');
  ui.view=V[h]?h:'home';
  ui.t.remaining=focusCfg.focus*60;
  render();
  initAuth();
})();
})();
</script>
</body>
</html>
